# electron-builder 配置（设计文档 1.5：打包分发走 CI，Windows 为主）
# 关键：所有运行时依赖已在构建期打包（主进程 esbuild、渲染层 Vite），
# 产物不依赖 node_modules，体积小、跨机器可用。
appId: com.spicycorn.ppims
productName: PPIMS
copyright: Copyright © 2026 spicycorn

# 应用图标：可爱小人整理文件夹（public/ 下；gen-icon.mjs 生成，derive-icons.mjs 派生多尺寸）
# icon.png 供 mac/linux/窗口；icon.ico 供 Windows exe/安装器
icon: public/icon.png

directories:
  output: release
  buildResources: buildResources

# 只打包真正需要的产物（package.json + 渲染层 dist + 主进程 dist-electron），
# 不携带 node_modules（生产依赖为空，全部已 bundle）。
files:
  - package.json
  - dist/**
  - dist-electron/**
  - "!node_modules/**"
  - "!core/**"
  - "!features/**"
  - "!dev/**"
  - "!.github/**"
  - "!*.md"
  - "!.npmrc"
  - "!release/**"

asar: true
compression: normal

# Windows 便携版单文件 exe（portable）：自解压到临时目录并直接运行，
# 无需安装、无卸载残留，双击即用，最适合"下载即用"的个人工具。
win:
  target:
    - target: portable
      arch:
        - x64
  artifactName: ${productName}-${version}-win-${arch}.${ext}
  # 代码签名占位：当前无证书则跳过签名（electron-builder 自动跳过）；
  # 将来拿到证书后，取消下面注释并配置即可启用签名。
  # certificateFile: buildResources/cert.pfx
  # certificatePassword: ${env.WIN_CSC_KEY_PASSWORD}

# 备用：如需改回 NSIS 安装向导，把上面 win.target 换成 `nsis` 并启用此块
# nsis:
#   oneClick: false
#   perMachine: false
#   allowToChangeInstallationDirectory: true
#   createDesktopShortcut: true
#   createStartMenuShortcut: true
#   shortcutName: PPIMS
#   deleteAppDataOnUninstall: false
#   artifactName: ${productName}-Setup-${version}.${ext}

# macOS / Linux 可选（按需启用 matrix）
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.productivity
  identity: null

linux:
  target:
    - AppImage
  category: Office
  maintainer: spicycorn

# 发布：自动上传到 GitHub Releases（由 CI 触发）
publish:
  provider: github
  owner: spicycorn
  repo: PPIMS
  private: false
