# PPIMS 打包与发布工作流（设计文档 §1.5：打包只能由 GitHub Actions 触发）
# 流程：安装依赖 → 类型检查 → 单元测试 → 构建(渲染+主进程) → electron-builder 打包
#      → SHA-256 校验和 → 上传 artifacts → 打 tag(vX.Y.Z) 时创建/追加 GitHub Release
name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: '22'
  # 与本地一致（pnpm 11），保证 lockfile 与 pnpm-workspace.yaml(allowBuilds) 行为相同
  PNPM_VERSION: '11'

jobs:
  build-windows:
    name: Build Windows installer (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies (runs electron/esbuild/vue-demi build scripts)
        run: pnpm install

      - name: Type check
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test

      - name: Build (renderer + main)
        run: pnpm run build

      - name: Package Windows installer (NSIS)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "=== electron-builder version ==="
          pnpm exec electron-builder --version
          Write-Host "=== running: electron-builder --win --x64 ==="
          $env:CSC_IDENTITY_AUTO_DISCOVERY = "false"
          pnpm exec electron-builder --win --x64
          $code = $LASTEXITCODE
          Write-Host "=== electron-builder exit code: $code ==="
          Write-Host "=== release/ contents (recursive) ==="
          if (Test-Path release) {
            Get-ChildItem release -Recurse | Select-Object FullName, Length | Format-Table -AutoSize
          } else {
            Write-Host "release/ does not exist!"
          }
          if ($code -ne 0) { Write-Host "PACKAGING FAILED (exit $code)"; exit $code }

      - name: Verify installer produced
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path release -File -Filter *.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "No .exe installer found in release/. Packaging did not produce an installer." }
          Write-Host "Installer: $($exe.FullName) ($([math]::Round($exe.Length/1MB,1)) MB)"

      - name: SHA-256 checksums + build metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem -Path release -File -Filter *.exe | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash
            Add-Content -Path "release/SHA256SUMS.txt" -Value "$hash  $($_.Name)"
          }
          $meta = @{
            product = "PPIMS"
            version = (Get-Content package.json -Raw | ConvertFrom-Json).version
            os = "windows"
            arch = "x64"
            builtAt = (Get-Date).ToString("yyyy-MM-dd HH:mm:ss zzz")
            runner = $env:RUNNER_OS
          } | ConvertTo-Json
          Set-Content -Path "release/BUILD_METADATA.json" -Value $meta -Encoding UTF8
          Get-Content release/SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ppims-windows-x64
          path: |
            release/*.exe
            release/SHA256SUMS.txt
            release/BUILD_METADATA.json
          if-no-files-found: error

      - name: Create / append GitHub Release (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "PPIMS ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            release/*.exe
            release/SHA256SUMS.txt
            release/BUILD_METADATA.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
